function prog(){const s=D.sec[cur];$('pg').textContent='Bagian '+(cur+1)+' dari '+D.sec.length+' · terjawab '+s.items.filter(function(q){return !em(get(q))}).length+' dari '+s.items.length}
function show(i){cur=i;[].slice.call(document.querySelectorAll('.sc')).forEach(function(e,j){e.style.display=j==i?'block':'none'});$('pv').style.display=i?'':'none';$('nx').style.display=i<D.sec.length-1?'':'none';$('sd').style.display=i==D.sec.length-1?'':'none';prog();window.scrollTo(0,0)}
function go(){
 if(!$('nm').value.trim()){$('nm').focus();alert('Pilih atau isi namamu dulu ya.');return}
 $('hs').style.display='none';$('ex').style.display='block';window.scrollTo(0,0);
 window.onbeforeunload=function(){return 'x'};
 if(D.dur){left=D.dur*60;$('tm').textContent='Sisa waktu '+mm(left);tick=setInterval(function(){left--;$('tm').textContent='Sisa waktu '+mm(Math.max(left,0));if(left<=0)fin(true)},1000)}
}
function fin(auto){
 if(done)return;
 const un=all.filter(function(q){return em(get(q))}).length;
 if(!auto&&un&&!confirm(un+' soal belum dijawab. Tetap kirim jawaban?'))return;
 done=true;clearInterval(tick);window.onbeforeunload=null;
 let tot=0,cnt=0,rv='',tx=[],ur=[],bag=[];
 const rd=function(x){return Math.round(x*100)/100};
 D.sec.forEach(function(s){
  let st=0,sn=0;
  s.items.forEach(function(q){
   const a=get(q),k=KK[q.id],r=sc(q,a,k),id=q.c+q.n;
   if(r!==null){cnt++;tot+=r;sn++;st+=r}
   tx.push(id+'. '+(fmt(q,a)||'(kosong)'));
   if(q.t=='uraian')ur.push(id+'. '+(fmt(q,a)||'(kosong)'));
   const mk=r===null?'<span class="nop">Dinilai guru</span>':r===1?'<span class="ok">Benar</span>':r===0?'<span class="no">Salah</span>':'<span class="no">Sebagian benar</span>';
   rv+='<div class="q"><div class="qt"><b>'+id+'.</b> '+esc(q.q)+' - '+mk+'</div><div>Jawabanmu: '+esc(fmt(q,a)||'(kosong)')+'</div>'+((D.key&&k!=null&&r!==1)?'<div class="kb">Kunci: '+esc(fmt(q,k))+(EX[q.id]?'<br>'+esc(EX[q.id]):'')+'</div>':'')+'</div>';
  });
  bag.push({t:s.title,n:s.items.length,tot:rd(st),cnt:sn,nl:sn?Math.round(st/sn*100):null});
 });
 const nilai=cnt?Math.round(tot/cnt*100):null,nm=$('nm').value.trim(),kl=$('kl').value.trim(),bn=rd(tot);
 const bl=bag.map(function(b){return b.t+': '+(b.cnt?b.tot+' dari '+b.cnt+' benar (nilai '+b.nl+')':'dinilai guru ('+b.n+' soal)')});
 const txt=D.title+' - '+D.subj+NL+'Nama: '+nm+NL+'Kelas: '+kl+NL+'Waktu: '+new Date().toLocaleString('id-ID')+NL+NL+'RINCIAN SKOR PER BAGIAN'+NL+bl.join(NL)+NL+NL+'NILAI AKHIR (gabungan semua jenis soal): '+(nilai==null?'-':nilai)+NL+'Total benar: '+bn+' dari '+cnt+' soal yang dinilai otomatis'+(ur.length?NL+NL+'JAWABAN URAIAN (dinilai guru)'+NL+ur.join(NL):'');
 const tb='<table style="margin:10px 0"><tr><th style="text-align:left">Bagian</th><th>Skor</th><th>Nilai</th></tr>'+bag.map(function(b){return '<tr><td>'+esc(b.t)+'</td><td>'+(b.cnt?b.tot+' / '+b.cnt:'guru')+'</td><td>'+(b.cnt?b.nl:'-')+'</td></tr>'}).join('')+'</table>';
 $('ex').style.display='none';
 $('rs').innerHTML='<div class="card"><p style="text-align:center;margin:0">Nilai akhir</p><div class="big">'+(nilai==null?'-':nilai)+'</div><p style="text-align:center">Terima kasih, <b>'+esc(nm)+'</b>'+(kl?' ('+esc(kl)+')':'')+'!</p>'+tb+(cnt<all.length?'<p>Soal uraian dinilai oleh guru.</p>':'')+'<p id="st" class="nop" style="text-align:center;color:#5d7078"></p><div class="nop" style="text-align:center"><button class="b" id="dl">Unduh hasil</button><button class="b g" id="cp">Salin hasil</button><button class="b g" onclick="print()">Cetak</button></div></div>'+(D.key?'<div class="card nop"><div class="sh">Pembahasan</div>'+rv+'</div>':'');
 $('cp').onclick=function(){navigator.clipboard.writeText(txt).then(function(){$('st').textContent='Hasil disalin. Tempelkan ke pesan untuk guru.'},function(){$('st').textContent='Gagal menyalin. Gunakan Unduh hasil.'})};
 $('dl').onclick=function(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='Hasil_'+nm.split(' ').join('_')+'.txt';document.body.appendChild(a);a.click();a.remove()};
 window.scrollTo(0,0);
 if(D.hook){fetch(D.hook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({nama:nm,kelas:kl,judul:D.title,mapel:D.subj,bagian:bl,nilai:nilai,benar:bn,jumlah:cnt,waktu:new Date().toISOString(),jawaban:tx})}).then(function(){$('st').textContent='Hasil sudah dikirim ke guru.'}).catch(function(){$('st').textContent='Hasil belum terkirim. Pakai Unduh atau Salin hasil, lalu kirim ke guru.'})}
}
(function(){
 const op=function(a){return a.map(function(n){return '<option>'+esc(n)+'</option>'}).join('')};
 const ro=D.rosters&&D.rosters.length;
 let ident;
 if(ro)ident='<label>Kelas<select id="kl"><option value="">- pilih kelas -</option>'+op(D.rosters.map(function(r){return r.n}))+'</select></label><br><br><label>Nama siswa<select id="nm"><option value="">- pilih kelas dulu -</option></select></label>';
 else ident='<label>Nama siswa'+(D.names&&D.names.length?'<select id="nm"><option value="">- pilih namamu -</option>'+op(D.names)+'</select>':'<input type="text" id="nm" autocomplete="off">')+'</label><br><br><label>Kelas / No. absen (opsional)<input type="text" id="kl" autocomplete="off" value="'+esc(D.cls||(D.grade?'Kelas '+D.grade:''))+'"></label>';
 const ln=function(t,c){return t?'<p class="'+c+'">'+esc(t)+'</p>':''};
 $('hs').innerHTML='<div class="card kop">'+(D.logoL?'<img src="'+D.logoL+'" alt="">':'')+(D.logoR?'<img src="'+D.logoR+'" alt="">':'')+ln(D.gov,'')+ln(D.dept,'')+(D.school?'<h1>'+esc(D.school)+'</h1>':'')+'<h1>'+esc(D.title)+'</h1>'+ln([D.subj,D.grade?'Kelas '+D.grade:'',D.sem?'Semester '+D.sem:'',D.year].filter(Boolean).join(' · '),'')+'</div><div class="card">'+(D.ins?'<p>'+esc(D.ins)+'</p>':'')+'<p>'+all.length+' soal'+(D.dur?' · waktu '+D.dur+' menit':'')+'</p>'+ident+'<button class="b" onclick="go()">Mulai mengerjakan</button></div>';
 if(ro)$('kl').onchange=function(){const r=D.rosters.filter(function(x){return x.n==$('kl').value})[0];$('nm').innerHTML='<option value="">'+(r?'- pilih namamu -':'- pilih kelas dulu -')+'</option>'+(r?op(r.names):'')};
 let h='<div class="bar"><span id="pg"></span><span id="tm"></span></div>';
 D.sec.forEach(function(s){h+='<div class="card sc" style="display:none"><div class="sh">'+esc(s.title)+'</div>'+(s.ins?'<div class="si">'+esc(s.ins)+'</div>':'')+s.items.map(qh).join('')+'</div>'});
 $('ex').innerHTML=h+'<div style="text-align:center"><button class="b g" id="pv" onclick="show(cur-1)">Bagian sebelumnya</button><button class="b" id="nx" onclick="show(cur+1)">Bagian berikutnya</button><button class="b" id="sd" onclick="fin(false)">Kirim jawaban</button></div>';
 $('ex').addEventListener('input',prog);show(0);
})();</script></body></html>
